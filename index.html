<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8dce9">
<title>Mis XV años · Esther Escarleth</title>
<style>
:root{--pink:#f5a8ce;--pink2:#ffcae4;--silver:#e9e9f2;--ink:#542b43}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#f8e8f0}
body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden}
.stage{position:relative;isolation:isolate;width:100%;min-height:100svh;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(135deg,#fbe9f2,#e8e8f2 48%,#f8dce9)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 43%;z-index:-3;animation:photoIn 1.3s ease both}
.stage:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(255,244,250,.78) 0%,rgba(255,239,248,.35) 36%,rgba(255,230,244,.02) 67%,rgba(255,226,241,.28) 100%)}
.glow{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.65),transparent 38%)}
.copy{position:relative;text-align:center;width:min(94%,900px);padding:clamp(28px,5vh,58px) 14px 120px;color:var(--ink);text-shadow:0 1px 10px rgba(255,255,255,.9);animation:rise 1.2s .15s both}
.welcome{font-style:italic;font-size:clamp(1.5rem,4.6vw,3.2rem);line-height:1.1;margin:0 0 5px;color:#8f476d}
.xv{font-weight:500;letter-spacing:.11em;line-height:1;font-size:clamp(2.7rem,8.6vw,6.6rem);margin:0;background:linear-gradient(110deg,#aeb0bf 0%,#fff 19%,#c1c1cf 37%,#fff 51%,#d58db2 73%,#fff 88%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.6px rgba(133,80,112,.45);filter:drop-shadow(0 3px 3px rgba(117,64,95,.18))}
.name{font-style:italic;font-size:clamp(2rem,6.3vw,4.8rem);line-height:1.08;margin:10px 0 0;color:#a64d7b}
.rule{width:min(54%,300px);height:1px;margin:17px auto 0;background:linear-gradient(90deg,transparent,#fff,#d69abb,#fff,transparent)}
.hint{font:600 10px/1.4 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#75445e;margin-top:13px}
.ball{--size:clamp(58px,9vw,112px);position:absolute;z-index:3;width:var(--size);height:var(--size);border-radius:50%;display:block;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 26px rgba(106,56,91,.2),inset -9px -10px 17px rgba(93,48,79,.24),inset 7px 6px 15px rgba(255,255,255,.8);background-color:#d9d9e3;background-image:linear-gradient(135deg,rgba(255,255,255,.96) 0 7%,transparent 8% 20%,rgba(255,255,255,.65) 21% 24%,transparent 25%),repeating-linear-gradient(0deg,transparent 0 10%,rgba(255,255,255,.78) 10.5% 12%,rgba(110,104,128,.22) 12.5% 13.5%,transparent 14% 24%),repeating-linear-gradient(90deg,#b8b8c8 0 9%,#fefcff 9.5% 19%,#bcbccc 19.5% 29%,#fff 29.5% 39%);background-blend-mode:screen,normal,normal;animation:float 4.6s ease-in-out infinite,spin 8s linear infinite;transition:filter .25s,transform .25s; -webkit-tap-highlight-color:transparent}
.ball:before{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(130deg,rgba(255,255,255,.9),transparent 27% 56%,rgba(78,61,90,.35));}
.ball:after{content:"✦";position:absolute;top:12%;left:20%;font-size:clamp(13px,2.2vw,23px);color:#fff;text-shadow:0 0 8px #fff,0 0 17px #fff;animation:twinkle 1.7s ease-in-out infinite alternate}
.ball:hover,.ball:focus-visible{filter:brightness(1.12);transform:scale(1.08);outline:3px solid rgba(255,255,255,.9);outline-offset:5px}
.ball.pink{background-color:#e99cc3;background-image:linear-gradient(135deg,rgba(255,255,255,.96) 0 7%,transparent 8% 20%,rgba(255,255,255,.65) 21% 24%,transparent 25%),repeating-linear-gradient(0deg,transparent 0 10%,rgba(255,255,255,.8) 10.5% 12%,rgba(126,43,93,.18) 12.5% 13.5%,transparent 14% 24%),repeating-linear-gradient(90deg,#d981b1 0 9%,#ffe7f4 9.5% 19%,#d78bb8 19.5% 29%,#fff1f9 29.5% 39%)}
.b1{top:28%;left:4%;animation-delay:-1s}.b2{top:47%;right:5%;--size:clamp(68px,11vw,132px);animation-delay:-2.2s}.b3{top:67%;left:10%;--size:clamp(43px,6.5vw,76px);animation-delay:-3s}.b4{top:15%;right:13%;--size:clamp(43px,6.2vw,74px);animation-delay:-.8s}.b5{top:57%;left:46%;--size:clamp(34px,4.5vw,56px);animation-delay:-1.5s}
.cta{position:absolute;z-index:4;left:50%;bottom:clamp(18px,4vh,42px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;text-transform:uppercase;letter-spacing:.13em;font:600 11px Arial,sans-serif;color:#743e5d;padding:14px 21px;border:1px solid rgba(255,255,255,.95);border-radius:999px;background:rgba(255,246,251,.8);box-shadow:0 6px 24px rgba(105,54,85,.12);backdrop-filter:blur(8px);transition:transform .25s,background .25s}
.cta:hover{background:#fff;transform:translateX(-50%) scale(1.04)}.arrow{font-size:16px}
.spark{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:0 0 9px 3px rgba(255,255,255,.95);animation:twinkle 2s infinite alternate;pointer-events:none}.s1{top:24%;left:25%}.s2{top:42%;right:25%;animation-delay:.6s}.s3{top:70%;right:18%;animation-delay:1.1s}.s4{top:11%;left:63%;animation-delay:.3s}
@keyframes spin{0%{background-position:0 0,0 0,0 0}100%{background-position:0 0,0 100px,100px 0}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -13px}}
@keyframes twinkle{from{opacity:.45;scale:.8}to{opacity:1;scale:1.18}}
@keyframes rise{from{opacity:0;translate:0 -16px}to{opacity:1;translate:0 0}}
@keyframes photoIn{from{opacity:.55;scale:1.035}to{opacity:1;scale:1}}
@media(max-width:600px){.photo{object-position:52% center}.stage:before{background:linear-gradient(180deg,rgba(255,242,249,.88) 0%,rgba(255,240,248,.53) 35%,rgba(255,230,244,.1) 70%,rgba(255,226,241,.4) 100%)}.copy{padding-top:34px}.b1{top:42%;left:2%}.b2{top:56%;right:2%}.b3{top:72%;left:6%}.b4{top:32%;right:5%}.b5{top:68%;left:47%}.cta{bottom:18px;padding:13px 16px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
