<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itinerario XV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff4fa3;
    --pink-light: #ff9ccc;
    --ink: #111111;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%;
    background: transparent !important;
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;
  }
  body { overflow-x: hidden; }
  .itinerary {
    position: relative;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 12px 28px;
    background: transparent;
    isolation: isolate;
  }
  .heading {
    text-align: center;
    margin: 0 0 24px;
    font-size: clamp(25px, 5vw, 36px);
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    animation: appear .9s ease both;
  }
  .heading::after {
    content: "";
    display: block;
    width: 76px;
    height: 2px;
    margin: 10px auto 0;
    background: var(--pink);
    box-shadow: 0 0 8px #ff4fa399;
  }
  .timeline {
    position: relative;
    width: 100%;
    padding: 0;
  }
  .spine {
    position: absolute;
    top: 22px;
    bottom: 22px;
    left: 50%;
    width: 2px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, #ff9ccc, #ff3d9b, #ff9ccc);
    box-shadow: 0 0 7px #ff4fa3aa, 0 0 15px #ff4fa344;
    border-radius: 8px;
  }
  .event {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1fr);
    align-items: center;
    min-height: 126px;
    opacity: 0;
    transform: translateY(13px);
    animation: appear .8s ease forwards;
  }
  .event:nth-child(2) { animation-delay: .15s; }
  .event:nth-child(3) { animation-delay: .35s; }
  .event:nth-child(4) { animation-delay: .55s; }
  .event:nth-child(5) { animation-delay: .75s; }
  .event:nth-child(6) { animation-delay: .95s; }
  .event:nth-child(7) { animation-delay: 1.15s; }
  .side {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
  }
  .event:nth-child(odd) .side-left {
    grid-column: 1; grid-row: 1; justify-content: flex-end; text-align: right;
  }
  .event:nth-child(odd) .side-right {
    grid-column: 3; grid-row: 1; justify-content: flex-start; text-align: left;
  }
  .event:nth-child(even) .side-left {
    grid-column: 1; grid-row: 1; justify-content: flex-end; text-align: right;
  }
  .event:nth-child(even) .side-right {
    grid-column: 3; grid-row: 1; justify-content: flex-start; text-align: left;
  }
  .icon-wrap {
    flex: 0 0 auto;
    width: clamp(42px, 7vw, 62px);
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .event-icon {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: grayscale(1) contrast(1.15);
  }
  .words { min-width: 0; }
  .event-title {
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 600;
    line-height: 1.05;
    margin: 0 0 5px;
  }
  .event-time {
    font-size: clamp(16px, 2.6vw, 20px);
    font-weight: 500;
    letter-spacing: .025em;
    margin: 0;
  }
  .marker-column {
    grid-column: 2; grid-row: 1;
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .marker {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--pink);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--pink), 0 0 9px #ff4fa3aa;
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .event.active .marker {
    transform: scale(1.55);
    box-shadow: 0 0 0 2px var(--pink), 0 0 16px #ff4fa3;
  }
  .disco-ball {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 0;
    width: clamp(56px, 9vw, 76px);
    height: clamp(56px, 9vw, 76px);
    object-fit: contain;
    transform: translate(-50%, -50%);
    pointer-events: none;
    filter: drop-shadow(0 0 5px #ff73b8aa);
    transition: top .8s cubic-bezier(.22,.8,.25,1);
    animation: spin 3s linear infinite;
    transform-origin: center center;
  }
  .disco-ball.arriving { animation: spin .9s ease-in-out 1; }
  @keyframes spin { from { rotate: 0deg; } to { rotate: 360deg; } }
  @keyframes appear { to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 480px) {
    .itinerary { padding: 18px 4px 22px; }
    .heading { margin-bottom: 16px; letter-spacing: .08em; }
    .event { grid-template-columns: minmax(0,1fr) 34px minmax(0,1fr); min-height: 112px; }
    .side { gap: 6px; padding: 7px 3px; }
    .icon-wrap { width: 36px; height: 56px; }
    .event-title { font-size: clamp(16px, 4.2vw, 20px); }
    .event-time { font-size: clamp(14px, 3.8vw, 17px); }
    .disco-ball { width: 53px; height: 53px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .event, .heading { animation: none; opacity: 1; transform: none; }
    .disco-ball { animation: none; transition: top .8s ease; }
  }
</style>
</head>

<script>
(function() {
  const timeline = document.getElementById('timeline');
  const ball = document.getElementById('movingBall');
  const events = Array.from(timeline.querySelectorAll('.event'));
  let current = 0;
  let timer = null;

  function moveTo(index, firstMove = false) {
    const event = events[index];
    if (!event) return;
    const marker = event.querySelector('.marker-column');
    const timelineRect = timeline.getBoundingClientRect();
    const markerRect = marker.getBoundingClientRect();
    const y = markerRect.top + markerRect.height / 2 - timelineRect.top;
    ball.style.top = y + 'px';
    events.forEach((item, i) => item.classList.toggle('active', i === index));
    ball.classList.remove('arriving');
    void ball.offsetWidth;
    if (!firstMove) ball.classList.add('arriving');
  }

  function nextStop() {
    current = (current + 1) % events.length;
    moveTo(current);
    timer = window.setTimeout(nextStop, 3000);
  }

  function start() {
    if (timer) window.clearTimeout(timer);
    current = 0;
    moveTo(current, true);
    timer = window.setTimeout(nextStop, 3000);
  }

  window.addEventListener('load', () => window.setTimeout(start, 300));
  window.addEventListener('resize', () => moveTo(current, true));
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => window.setTimeout(() => moveTo(current, true), 150));
  }
  start();
})();
</script>
