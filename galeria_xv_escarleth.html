<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería XV años</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 0;
  background: transparent;
  font-family: 'Cormorant Garamond', serif;
}

.galeria {
  width: 100%;
  max-width: 900px;
  margin: auto;
  overflow: hidden;
  position: relative;
  padding: 15px 0 22px;
}

.carrusel {
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.7s ease;
  will-change: transform;
}

.foto {
  flex: 0 0 31%;
  height: 340px;
  overflow: hidden;
  background: #fff;
  padding: 6px;
  border-radius: 100px 100px 8px 8px;
  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.13);
  transition: height 0.7s ease;
}

.foto img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
  border-radius: 95px 95px 5px 5px;
}

.foto.activa { height: 380px; }

.indicadores {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}

.punto {
  width: 7px;
  height: 7px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: #e8c8d2;
  cursor: pointer;
  transition: all 0.3s ease;
}

.punto.activo {
  width: 22px;
  border-radius: 10px;
  background: #d69eaf;
}

@media (max-width: 600px) {
  .galeria { padding: 10px 0 16px; }
  .carrusel { gap: 9px; }
  .foto {
    flex-basis: 44%;
    height: 260px;
    padding: 5px;
    border-radius: 80px 80px 7px 7px;
  }
  .foto img { border-radius: 75px 75px 4px 4px; }
  .foto.activa { height: 290px; }
}

@media (prefers-reduced-motion: reduce) {
  .carrusel, .foto, .punto { transition: none; }
}
</style>
</head>

<body>
<div class="galeria" id="galeria">
  <div class="carrusel" id="carrusel">
    <div class="foto"><img src="foto1.jpg" alt="Sesión de XV años, Escarleth 1"></div>
    <div class="foto"><img src="foto2.jpg" alt="Sesión de XV años, Escarleth 2"></div>
    <div class="foto"><img src="foto3.jpg" alt="Sesión de XV años, Escarleth 3"></div>
    <div class="foto"><img src="foto4.jpg" alt="Sesión de XV años, Escarleth 4"></div>
    <div class="foto"><img src="foto5.jpg" alt="Sesión de XV años, Escarleth 5"></div>
    <div class="foto"><img src="foto6.jpg" alt="Sesión de XV años, Escarleth 6"></div>
  </div>
  <div class="indicadores" id="indicadores"></div>
</div>

<script>
const carrusel = document.getElementById("carrusel");
const galeria = document.getElementById("galeria");
const fotos = Array.from(carrusel.querySelectorAll(".foto"));
const indicadores = document.getElementById("indicadores");

let actual = 0;
let temporizador;
let inicioX = 0;

fotos.forEach((foto, i) => {
  const punto = document.createElement("button");
  punto.className = "punto";
  punto.setAttribute("aria-label", "Ver foto " + (i + 1));
  punto.addEventListener("click", () => {
    mostrar(i);
    reiniciar();
  });
  indicadores.appendChild(punto);
});

function mostrar(indice) {
  actual = (indice + fotos.length) % fotos.length;

  fotos.forEach((foto, i) => {
    foto.classList.toggle("activa", i === actual);
  });

  const foto = fotos[actual];
  const centroFoto = foto.offsetLeft + foto.offsetWidth / 2;
  const desplazamiento = centroFoto - galeria.clientWidth / 2;
  const maximo = carrusel.scrollWidth - galeria.clientWidth;
  const posicion = Math.max(0, Math.min(desplazamiento, maximo));

  carrusel.style.transform = `translateX(${-posicion}px)`;

  Array.from(indicadores.children).forEach((punto, i) => {
    punto.classList.toggle("activo", i === actual);
  });
}

function siguiente() { mostrar(actual + 1); }

function reiniciar() {
  clearInterval(temporizador);
  temporizador = setInterval(siguiente, 2000);
}

galeria.addEventListener("touchstart", e => {
  inicioX = e.touches[0].clientX;
}, { passive: true });

galeria.addEventListener("touchend", e => {
  const diferencia = e.changedTouches[0].clientX - inicioX;
  if (Math.abs(diferencia) > 40) {
    mostrar(actual + (diferencia < 0 ? 1 : -1));
    reiniciar();
  }
}, { passive: true });

window.addEventListener("resize", () => mostrar(actual));

mostrar(0);
reiniciar();
</script>
</body>
</html>
